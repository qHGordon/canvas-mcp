[project]
name = "canvas-mcp"
version = "0.1.0"
description = "Read-only MCP server for Canvas LMS (courses, assignments, announcements, modules, files, pages, discussions, grades, calendar)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
canvas-mcp = "canvas_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
